<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CyTube Plus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon.svg" alt="" width="28" height="28">
    <div>
      <h1>CyTube Plus</h1>
      <p id="version" class="muted"></p>
    </div>
  </header>

  <section id="here" hidden>
    <label class="row">
      <span class="text">
        <span class="title">On for this channel</span>
        <span class="hint" id="here-name"></span>
      </span>
      <input type="checkbox" role="switch" id="here-toggle">
    </label>
  </section>

  <section>
    <h2>Look</h2>
    <label class="row">
      <span class="text">
        <span class="title">Polished look</span>
        <span class="hint">Tidier chat, playlist and player.</span>
      </span>
      <input type="checkbox" role="switch" id="polished">
    </label>
    <label class="row">
      <span class="text">
        <span class="title">Coloured names</span>
        <span class="hint">Every name gets its own colour.</span>
      </span>
      <input type="checkbox" role="switch" id="colourNames">
    </label>
  </section>

  <section>
    <h2>Chat</h2>
    <label class="row">
      <span class="text">
        <span class="title">Highlight mentions and PMs</span>
      </span>
      <input type="checkbox" role="switch" id="highlights">
    </label>
    <label class="row">
      <span class="text">
        <span class="title">Click names and emotes</span>
        <span class="hint">A name to reply, an emote to use it.</span>
      </span>
      <input type="checkbox" role="switch" id="clickToInsert">
    </label>
    <label class="row">
      <span class="text">
        <span class="title">Shrink big emotes</span>
      </span>
      <input type="checkbox" role="switch" id="emoteSizes">
    </label>
  </section>

  <!-- A feature's own settings show only while it's on. -->
  <section>
    <h2>Niconico comments</h2>
    <label class="row">
      <span class="text">
        <span class="title">Fly chat over the video</span>
        <span class="hint">Same as the square button under it.</span>
      </span>
      <input type="checkbox" role="switch" id="nico">
    </label>
    <div class="sub" id="nico-sub">
      <div class="sliders">
        <label class="slider">
          <span class="slider-head"><span>Speed</span><output id="nicoSpeed-value"></output></span>
          <input type="range" id="nicoSpeed" min="50" max="200" step="25">
        </label>
        <label class="slider" id="nico-opacity-slider">
          <span class="slider-head"><span>Emote opacity</span><output id="nicoEmoteOpacity-value"></output></span>
          <input type="range" id="nicoEmoteOpacity" min="10" max="100" step="5">
        </label>
      </div>
      <label class="row">
        <span class="text">
          <span class="title">Emotes only</span>
        </span>
        <input type="checkbox" role="switch" id="nicoEmotesOnly">
      </label>
      <label class="row">
        <span class="text">
          <span class="title">Text only</span>
        </span>
        <input type="checkbox" role="switch" id="nicoTextOnly">
      </label>
    </div>
  </section>

  <section>
    <h2>Hybrid chat</h2>
    <label class="row">
      <span class="text">
        <span class="title">Chat over fullscreen video</span>
        <span class="hint">Same as the triangle button under it.</span>
      </span>
      <input type="checkbox" role="switch" id="hybrid">
    </label>
    <div class="sub" id="hybrid-sub">
      <div class="sliders">
        <label class="slider">
          <span class="slider-head"><span>Text size</span><output id="hybridTextSize-value"></output></span>
          <input type="range" id="hybridTextSize" min="80" max="200" step="10">
        </label>
        <label class="slider">
          <span class="slider-head"><span>Opacity</span><output id="hybridOpacity-value"></output></span>
          <input type="range" id="hybridOpacity" min="20" max="100" step="5">
        </label>
      </div>
      <label class="row">
        <span class="text">
          <span class="title">On the left</span>
          <span class="hint">Off puts it on the right.</span>
        </span>
        <input type="checkbox" role="switch" id="hybridLeft">
      </label>
      <label class="row">
        <span class="text">
          <span class="title">Fade old messages</span>
          <span class="hint">New ones stay bright.</span>
        </span>
        <input type="checkbox" role="switch" id="hybridDims">
      </label>
    </div>
  </section>

  <section>
    <h2>Lights down</h2>
    <label class="row">
      <span class="text">
        <span class="title">Bulb button</span>
        <span class="hint">Dims the page around the video.</span>
      </span>
      <input type="checkbox" role="switch" id="lightsButton">
    </label>
    <div class="sub" id="lights-sub">
      <div class="sliders">
        <label class="slider">
          <span class="slider-head"><span>Darkness</span><output id="dim-value"></output></span>
          <input type="range" id="dim" min="30" max="100" step="5">
        </label>
        <label class="slider">
          <span class="slider-head"><span>Lifts for</span><output id="peekSeconds-value"></output></span>
          <input type="range" id="peekSeconds" min="0" max="10" step="1">
        </label>
      </div>
      <label class="row">
        <span class="text">
          <span class="title">Dim the chat separately</span>
          <span class="hint">Chat gets its own lighter dim.</span>
        </span>
        <input type="checkbox" role="switch" id="chatDimSeparate">
      </label>
      <div class="sliders" id="chat-dim-sliders">
        <label class="slider">
          <span class="slider-head"><span>Chat darkness</span><output id="chatDim-value"></output></span>
          <input type="range" id="chatDim" min="0" max="100" step="5">
        </label>
      </div>
    </div>
  </section>

  <section>
    <h2>Sync</h2>
    <label class="row">
      <span class="text">
        <span class="title">Turn off sync</span>
        <span class="hint">Watch at your own pace.</span>
      </span>
      <input type="checkbox" role="switch" id="syncOff">
    </label>
  </section>

  <section>
    <h2>Blacklist</h2>
    <ul id="off-list"></ul>
    <p id="off-empty" class="empty" hidden>No channels blacklisted.</p>
    <form id="off-add" class="add">
      <input id="off-input" type="text" placeholder="Channel name or link" aria-label="Channel to blacklist" autocomplete="off" spellcheck="false">
      <button type="submit">Add</button>
    </form>
    <p id="off-error" class="error" hidden></p>
  </section>

  <footer>
    <a id="source" class="source" href="https://github.com/Hostu404/cytube-plus">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8.7 16.3 4.4 12l4.3-4.3-1.4-1.4L1.6 12l5.7 5.7zm6.6 0 1.4 1.4 5.7-5.7-5.7-5.7-1.4 1.4 4.3 4.3z"/></svg>
      View source
    </a>
    <p class="muted">Changes apply instantly. Unofficial, not made by CyTube.</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
