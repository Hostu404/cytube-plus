<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CyTube Plus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon.svg" alt="" width="28" height="28">
    <div>
      <h1>CyTube Plus</h1>
      <p id="version" class="muted"></p>
    </div>
  </header>

  <section id="here" hidden>
    <label class="row">
      <span class="text">
        <span class="title">On for this channel</span>
        <span class="hint" id="here-name"></span>
      </span>
      <input type="checkbox" role="switch" id="here-toggle">
    </label>
  </section>

  <section>
    <h2>Look</h2>
    <label class="row">
      <span class="text">
        <span class="title">Polished look</span>
        <span class="hint">Cleaner chat, playlist, poll and player, and lighter for the browser to draw. Channel CSS still overrides it.</span>
      </span>
      <input type="checkbox" role="switch" id="polished">
    </label>
    <label class="row">
      <span class="text">
        <span class="title">Coloured names</span>
        <span class="hint">Every name in chat gets its own colour. Staff keep their rank colours.</span>
      </span>
      <input type="checkbox" role="switch" id="colourNames">
    </label>
  </section>

  <section>
    <h2>Video</h2>
    <label class="row">
      <span class="text">
        <span class="title">Niconico comments</span>
        <span class="hint">Chat messages fly across the video. Same as the square button under it.</span>
      </span>
      <input type="checkbox" role="switch" id="nico">
    </label>
    <div class="sliders" id="nico-sliders">
      <label class="slider">
        <span class="slider-head"><span>Speed</span><output id="nicoSpeed-value"></output></span>
        <input type="range" id="nicoSpeed" min="50" max="200" step="25">
      </label>
    </div>
    <label class="row">
      <span class="text">
        <span class="title">Turn off sync</span>
        <span class="hint">Pause and skip the video on your own, or click a title in the playlist to watch it. The bar under the video puts you back in sync.</span>
      </span>
      <input type="checkbox" role="switch" id="syncOff">
    </label>
    <label class="row">
      <span class="text">
        <span class="title">Lights down button</span>
        <span class="hint">Bulb button under the video that dims the rest of the page. Click outside the video to lift it for a bit.</span>
      </span>
      <input type="checkbox" role="switch" id="lightsButton">
    </label>
    <div class="sliders" id="lights-sliders">
      <label class="slider">
        <span class="slider-head"><span>Darkness</span><output id="dim-value"></output></span>
        <input type="range" id="dim" min="30" max="100" step="5">
      </label>
      <label class="slider">
        <span class="slider-head"><span>Lifts for</span><output id="peekSeconds-value"></output></span>
        <input type="range" id="peekSeconds" min="0" max="10" step="1">
      </label>
    </div>
    <label class="row" id="chat-dim-row">
      <span class="text">
        <span class="title">Dim the chat separately</span>
        <span class="hint">Chat gets its own lighter dim.</span>
      </span>
      <input type="checkbox" role="switch" id="chatDimSeparate">
    </label>
    <div class="sliders" id="chat-dim-sliders">
      <label class="slider">
        <span class="slider-head"><span>Chat darkness</span><output id="chatDim-value"></output></span>
        <input type="range" id="chatDim" min="0" max="100" step="5">
      </label>
    </div>
  </section>

  <section>
    <h2>Chat</h2>
    <label class="row">
      <span class="text">
        <span class="title">Highlight mentions and PMs</span>
        <span class="hint">Messages that mention you and PMs stand out.</span>
      </span>
      <input type="checkbox" role="switch" id="highlights">
    </label>
    <label class="row">
      <span class="text">
        <span class="title">Click names and emotes</span>
        <span class="hint">Click a name to reply, or an emote to add it to your message.</span>
      </span>
      <input type="checkbox" role="switch" id="clickToInsert">
    </label>
    <label class="row">
      <span class="text">
        <span class="title">Shrink big emotes</span>
        <span class="hint">Oversized emotes get smaller, more so mid-message. Small ones are left alone.</span>
      </span>
      <input type="checkbox" role="switch" id="emoteSizes">
    </label>
  </section>

  <section>
    <h2>Blacklist</h2>
    <ul id="off-list"></ul>
    <p id="off-empty" class="empty" hidden>No channels blacklisted.</p>
    <form id="off-add" class="add">
      <input id="off-input" type="text" placeholder="Channel name or link" aria-label="Channel to blacklist" autocomplete="off" spellcheck="false">
      <button type="submit">Add</button>
    </form>
    <p id="off-error" class="error" hidden></p>
  </section>

  <footer>
    <a id="source" class="source" href="https://github.com/Hostu404/cytube-plus">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8.7 16.3 4.4 12l4.3-4.3-1.4-1.4L1.6 12l5.7 5.7zm6.6 0 1.4 1.4 5.7-5.7-5.7-5.7-1.4 1.4 4.3 4.3z"/></svg>
      View source
    </a>
    <p class="muted">Changes apply instantly. Unofficial, not made by CyTube.</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
